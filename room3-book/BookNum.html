<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>books-escape room</title>
    <link rel="stylesheet" href="BookNum.css">
</head>
<body>

    <button id="hintButton" class="hint-button">💡</button>
    <div id="hintBox" class="hint-box">Hint: What name did you discover in the previous puzzle? Do you see it reflected in the drawings on the books?</div>

    <img src="pictures/arrow.png" id="backArrow" class="back-arrow" alt="Back">

    <button class="star-button" id="star1" onclick="checkStar(1)"></button>
    <button class="star-button" id="star2" onclick="checkStar(2)"></button>
    <button class="star-button" id="star3" onclick="checkStar(3)"></button>
    <button class="star-button" id="star4" onclick="checkStar(4)"></button>
    <button class="star-button" id="star5" onclick="checkStar(5)"></button>
    <button class="star-button" id="star6" onclick="checkStar(6)"></button>

    <div id="puzzleModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePuzzle()">&times;</span>
            <img id="puzzleImage" src="" alt="Book puzzle">
            <div class="hint-container">
                <button class="hint-btn" onclick="showHint()">💡</button>
                <p id="hintText" class="hidden"></p>
            </div>
        </div>
    </div>

    <script src="BookNum.js"></script>
    <script src="../devmenu.js"></script>
</body>
</html>
