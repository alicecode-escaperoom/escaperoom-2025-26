<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Escaped!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Schoolbell&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fff4fe;
            font-family: 'Architects Daughter', cursive;
            text-align: center;
            padding: 40px 20px;
        }
        h1 { font-size: 3rem; margin-bottom: 12px; }
        h2 { font-size: 1.6rem; font-weight: normal; margin-bottom: 32px; }
        #heart { font-size: 3rem; margin: 0; }
        .play-again {
            margin-top: 32px;
            padding: 12px 28px;
            font-size: 1rem;
            font-family: 'Architects Daughter', cursive;
            background: #e8a0e8;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .play-again:hover { background: #d070d0; }
        .logo-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 40px;
        }
        .logo-bar img { height: 70px; }
    </style>
</head>
<body>
    <h1>Well Done!</h1>
    <h2>You escaped all the rooms!</h2>
    <h2>Thanks for playing!</h2>
    <p id="heart">♡</p>
    <button class="play-again" onclick="window.location.href='index.html'">Play Again</button>
    <div class="logo-bar">
        <img src="alicecode%20girl%20icon.avif" alt="AliceCode Girl">
        <img src="alicecode%20logo%20.avif" alt="AliceCode Logo">
    </div>
    <script src="devmenu.js"></script>
</body>
</html>
