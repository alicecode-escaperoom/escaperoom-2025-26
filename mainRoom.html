<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Escape Room</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ROOM -->
   <div class="book-container">
    <img src="pictures/btnBook.png" class="book-btn" alt="book">
    <div class="exclamation">!</div>
  </div>
  <div class="room">
    <img src="pictures/btnBook.png" id="bookButton" class="book-btn" alt="book">
    <img src="star.png" class="magic-star" alt="star">
  </div>

  <!-- POPUP -->
  <div id="bookPopup" class="modal">
    <div class="modal-content">
      <button id="closePopup" class="close-btn">✕</button>
      <img src="pictures/BookText.jpeg" class="modal-img" alt="Book text">
    </div>
  </div>

  <script src="room1code.js"></script>
</body>
</html>
