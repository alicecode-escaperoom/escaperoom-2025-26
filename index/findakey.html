<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/style.css">
<style>
        .clickable-image {
            position: absolute;
            top: 490px;   
            left: 250px;     
            width: 120px;    
            cursor: pointer; 
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .clickable-image:hover {
            opacity: 0.8;   
            border: 2px solid #007bff;
        }
    </style>
</head>

<body>

    <img src="../img/ghost-removebg-preview.png" class="ghost"/>

    <img src="../img/key-removebg-preview.png" 
         class="clickable-image key" 
         onclick="handleClick()"
         alt="תמונה לחיצה">


         <img src="../img/startsign-removebg-preview.png"/>
    
        
    <script>
        function handleClick() {
            alert('Now answer the riddle')
            window.location.href = "riddle.html"

        }
    </script>

</body>
</html>
