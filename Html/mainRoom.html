<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Escape Room</title>
  <link rel="stylesheet" href="../Css/styles.css" />
</head>
<body>
  <div class="room">
    <div class="book-container" id="bookButton">
      <img src="../pictures/btnBook.png" class="book-btn" alt="book">
      <img src="../pictures/exclamation.png" class="exclamation" alt="!">
    </div>

    <img src="../pictures/star.png" id="magicStar" class="magic-star" alt="star">
    <img src="../pictures/ladder.png" id="ladder" class="ladder" alt="ladder">
    <img src="../pictures/hatch.png" id="roofHatch" class="roof-hatch" alt="hatch">
    <img src="../pictures/lock.png" id="atticLock" class="attic-lock" alt="lock">

    <div id="bookPopup" class="modal">
      <div class="modal-content">
        <button id="closePopup" class="close-btn">✕</button>
        <button id="hintBtn" class="hint-btn">💡</button>
        <div id="hintMessage" class="hint-message">
          Hint: The answer is hidden in plain sight. Check the first letters of the last lines.
        </div>
        <img src="../pictures/BookText.jpeg" class="modal-img" alt="Book text">
      </div>
    </div>
  </div>

  <script src="../Js/room1code.js"></script>
</body>
</html>
