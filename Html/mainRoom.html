<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Escape Room</title>
  <link rel="stylesheet" href="../Css/styles.css" />
</head>
<body>
  <div class="room">

    <div class="book-container" id="bookButton">
      <img src="../pictures/btnBook.png" class="book-btn" alt="book">
      <img src="../pictures/exclamation.png" class="exclamation" alt="!">
    </div>

    <img src="../pictures/star.png" id="magicStar" class="magic-star" alt="star">

  </div>

  <div id="bookPopup" class="modal">
    <div class="modal-content">
      <button id="closePopup" class="close-btn">✕</button>
      <button id="hintBtn" class="hint-btn">💡</button>
      <img src="../pictures/BookText.jpeg" class="modal-img" alt="Book text">
</div>
  </div>

  <script src="../Js/room1code.js"></script>

</body>
</html>
